name: godhaar-go-apiserver

services:
  godhaar-go-apiserver:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod

    image: godhaar-go-apiserver
    container_name: godhaar-go-apiserver

    env_file:
      - ./secrets/.env

    environment:
      GCS_CREDENTIALS_PATH: /app/secrets/gcs_key.json

    volumes:
      - ./secrets/gcs_key.json:/app/secrets/gcs_key.json:ro

    ports:
      - "${PORT}:${PORT}"

    networks:
      - godhaar-net.dev

    restart: unless-stopped

networks:
  godhaar-net.dev:
    external: true
